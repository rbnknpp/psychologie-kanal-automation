name: Taeglicher Lauf (Psychologie und Alltags Fakten)

run-name: ${{ inputs.test && 'TEST' || (inputs.only_shorts && 'Nur Shorts' || 'Tageslauf') }}

on:
  schedule:
    # GitHub laesst geplante Laeufe gelegentlich verspaetet oder gar nicht starten. Darum mehrere
    # Startzeiten; der Pruef-Schritt unten sorgt dafuer, dass pro Tag nur EIN Lauf durchgeht.
    - cron: "17 5 * * *"   # 07:17 MESZ / 06:17 MEZ (Veroeffentlichung laeuft ueber config.PUBLISH_TIMES)
    - cron: "47 6 * * *"   # Reserve
    - cron: "47 8 * * *"   # zweite Reserve
  workflow_dispatch:
    inputs:
      test:
        description: "Testlauf: 1 Short, kein langes Video, Upload nur privat"
        type: boolean
        default: false
      only_shorts:
        description: "Nur die Shorts neu erzeugen (kein langes Video), Doppellauf-Schutz umgehen"
        type: boolean
        default: false

concurrency:
  group: daily-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      TTS_ENGINE: piper
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - name: Pruefen, ob heute schon ein Tageslauf laeuft oder erfolgreich war
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?created=%3E%3D${today}&per_page=50"             --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.display_title != \"TEST\") | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          echo "Andere Tageslaeufe heute (laufend oder erfolgreich): $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg und Schriften installieren
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-liberation

      - name: Python-Pakete installieren
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Piper-Stimme (aus Cache oder Download)
        id: voice-cache
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: assets/voices
          key: piper-voice-de_DE-thorsten-medium
      - name: Piper-Stimme herunterladen
        if: steps.guard.outputs.skip != 'true' && steps.voice-cache.outputs.cache-hit != 'true'
        run: python -m piper.download_voices --download-dir assets/voices de_DE-thorsten-medium

      - name: YouTube-Zugangsdaten bereitstellen
        if: steps.guard.outputs.skip != 'true'
        env:
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          printf '%s' "$YT_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YT_TOKEN" > token.json

      - name: Erfolgsmuster aus YouTube Analytics aktualisieren (letzte 10 Tage)
        if: steps.guard.outputs.skip != 'true' && inputs.test != true
        continue-on-error: true
        env:
          TOKEN_PSYCH: ${{ secrets.ANALYTICS_TOKEN_PSYCHOLOGIE }}
          CI: "true"
        run: |
          cp client_secret.json report/client_secret.json
          printf '%s' "$TOKEN_PSYCH" > report/token_psychologie.json
          cd report && python performance_insights.py psychologie 10

      - name: Videos erzeugen
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python pipeline.py --test
          elif [ "${{ inputs.only_shorts }}" = "true" ]; then python pipeline.py --no-longform
          else python pipeline.py; fi

      - name: Hochladen (bis zu 3 Versuche, bereits Hochgeladenes wird uebersprungen)
        if: steps.guard.outputs.skip != 'true'
        run: |
          ARGS=""
          if [ "${{ inputs.test }}" = "true" ]; then ARGS="--privacy private"; fi
          if [ "${{ inputs.only_shorts }}" = "true" ]; then ARGS="$ARGS --only shorts"; fi
          for i in 1 2 3; do
            if python upload_cli.py $ARGS; then exit 0; fi
            echo "Upload-Versuch $i fehlgeschlagen, warte 90 s..."
            sleep 90
          done
          exit 1

      - name: Alte Beschreibungen auf Amazon-Partnerlink umstellen (max. 25 pro Tag)
        if: steps.guard.outputs.skip != 'true' && inputs.test != true
        continue-on-error: true
        run: python update_affiliate.py --max 25

      - name: Zustand zurueck ins Repository schreiben
        if: ${{ always() && inputs.test != true && steps.guard.outputs.skip != 'true' }}
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add state.json fact_history.json playlists_cache.json hypnosis_themes.json affiliate_done.json performance_insights.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Tageszustand aktualisiert [skip ci]"
            git pull --rebase -q || true
            git push || true
          fi

      - name: Alarm-Mail bei Fehler
        if: failure() && steps.guard.outputs.skip != 'true'
        run: python notify.py "Psychologie-Kanal (Cloud)" "GitHub-Actions-Lauf"
