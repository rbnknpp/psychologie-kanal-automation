name: gg.cuts Clips (TikTok-Entwuerfe)

on:
  schedule:
    - cron: "15 7 * * *"   # 08:15 MEZ – 3 SkiiMaskTimmy-Clips, landen ueber gaming-upload als Entwurf bei @gg.cuts.tv
  workflow_dispatch:
    inputs:
      count:
        description: "Anzahl Clips"
        type: string
        default: "3"
      test:
        description: "Testlauf: rendern, nicht einreihen"
        type: boolean
        default: false

concurrency:
  group: ggcuts-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GGCUTS_UPLOAD_TOKEN: ${{ secrets.GGCUTS_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && break
            echo "apt-Versuch $i fehlgeschlagen, warte 60 s"; sleep 60
          done
      - name: Python-Pakete
        run: pip install -U yt-dlp faster-whisper anthropic requests numpy Pillow
      - name: Whisper-Modell (Cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Clips erzeugen und einreihen
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python -m ggcuts.make --count "${{ inputs.count || 3 }}" --test
          else python -m ggcuts.make --count "${{ inputs.count || 3 }}"; fi
      - name: Testclips sichern
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: ggcuts-test
          path: ggcuts/work/*.mp4
          retention-days: 3
      - name: Stand speichern
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "ggcuts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ggcuts/state.json || true
          git diff --cached --quiet || (git commit -m "gg.cuts: Stand $(date -u +%F)" && git pull --rebase -q && git push)
