name: gg.cuts Clips (TikTok-Entwuerfe)

on:
  schedule:
    - cron: "15 7 * * *"   # 08:15 MEZ – 3 SkiiMaskTimmy-Clips, landen ueber gaming-upload als Entwurf bei @gg.cuts.tv
  workflow_dispatch:
    inputs:
      count:
        description: "Anzahl Clips gesamt (leer/0 = per_day je Kampagne aus campaigns.json)"
        type: string
        default: "0"
      test:
        description: "Testlauf: rendern, nicht einreihen"
        type: boolean
        default: false
      only:
        description: "Nur diese Kampagne (key aus campaigns.json, leer = alle)"
        type: string
        default: ""

concurrency:
  group: ggcuts-daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guard:
    # Hauptauslöser ist Supabase (pg_cron -> workflow_dispatch). Der GitHub-Zeitplan ist nur Reserve:
    # lief heute schon ein Dispatch, wird der geplante Lauf übersprungen (keine doppelten Videos).
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w "${{ github.workflow }}" --created ">=$(date -u +%F)" --json event -q '[.[]|select(.event=="workflow_dispatch")]|length')
            [ "${n:-0}" -gt 0 ] && skip=1
          fi
          # Kanal-Schalter im Agent-HQ (Seite „Kanäle & Projekte“): ruhen alle Kanäle dieses Workflows, nichts tun.
          K=sb_publishable_TvKHtP7D400zXCBFj4icPA_c7T6Hosp
          st=$(curl -s -m 15 -X POST https://kfiiaqjzzwwacthzrcut.supabase.co/rest/v1/rpc/project_status_all -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{}' || true)
          on=$(echo "$st" | jq -r '[.["tt-ggcuts"]] | map(. // "aktiv") | any(. == "aktiv")' 2>/dev/null || echo true)
          echo "Kanal aktiv: $on"
          if [ "$on" = "false" ] && [ "${{ inputs.test }}" != "true" ]; then skip=1; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"
  run:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GGCUTS_UPLOAD_TOKEN: ${{ secrets.GGCUTS_UPLOAD_TOKEN }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg (aktueller Static-Build – Ubuntus 6.1 schneidet Twitch-HLS-Ausschnitte leer)
        run: |
          curl -sL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          echo "/tmp/ff/bin" >> "$GITHUB_PATH"
          /tmp/ff/bin/ffmpeg -version | head -1
      - name: Python-Pakete
        run: pip install -U yt-dlp "faster-whisper==1.2.1" "av==18.0.0" anthropic requests numpy Pillow "opencv-python-headless<5"
      - name: Whisper-Modell (Cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Clips erzeugen und einreihen
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python -m ggcuts.make --count "${{ inputs.count || 0 }}" --only "$ONLY" --test
          else python -m ggcuts.make --count "${{ inputs.count || 0 }}" --only "$ONLY"; fi
      - name: Testclips sichern
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: ggcuts-test
          path: ggcuts/work/*.mp4
          retention-days: 3
      - name: Stand speichern
        if: ${{ always() && !inputs.test }}
        run: |
          git config user.name "ggcuts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ggcuts/state.json || true
          git diff --cached --quiet || (git commit -m "gg.cuts: Stand $(date -u +%F)" && git pull --rebase -q && git push)
