name: Wochenbericht (beide Kanaele)

on:
  schedule:
    - cron: "0 18 * * 0"   # Sonntag 18:00 UTC = 20:00 MESZ / 19:00 MEZ
  workflow_dispatch:

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Python-Pakete installieren
        run: pip install -r report/requirements.txt

      - name: Analytics-Zugangsdaten bereitstellen
        env:
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          TOKEN_PSYCH: ${{ secrets.ANALYTICS_TOKEN_PSYCHOLOGIE }}
          TOKEN_FIN: ${{ secrets.ANALYTICS_TOKEN_FINANZ }}
        run: |
          printf '%s' "$CLIENT_SECRET" > report/client_secret.json
          printf '%s' "$TOKEN_PSYCH" > report/token_psychologie.json
          printf '%s' "$TOKEN_FIN" > report/token_finanz.json

      - name: Bericht erzeugen und per Mail verschicken
        run: python report/weekly_report.py

      - name: Erfolgsmuster zurueck ins Repository schreiben
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add performance_insights.json finanz_performance_insights.json
          if ! git diff --cached --quiet; then
            git commit -m "Wochenauswertung aktualisiert [skip ci]"
            git pull --rebase -q || true
            git push || true
          fi

      - name: Alarm-Mail bei Fehler
        if: failure()
        run: python notify.py "Wochenbericht (Cloud)" "GitHub-Actions-Lauf"
