name: Was waere wenn (YouTube)

on:
  schedule:
    - cron: "0 7 * * 0,2,4,6"   # Sa/So/Di/Do 08:00 MEZ: Folge fuer den naechsten Tag (Mo/Mi/Fr/So 17 Uhr) + Shorts (12/19 Uhr)
  workflow_dispatch:
    inputs:
      folge:
        description: "Folgen-JSON (leer = Claude schreibt die naechste)"
        type: string
        default: ""
      publish:
        description: "Veroeffentlichung YYYY-MM-DD (17 Uhr); leer = morgen"
        type: string
        default: ""
      shorts_days:
        description: "Tage mit je 2 Shorts (leer = 2, sonntags 1)"
        type: string
        default: ""
      test:
        description: "Testlauf: nur rendern, nichts hochladen"
        type: boolean
        default: false

concurrency:
  group: waswaerewenn
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guard:
    # Hauptauslöser ist Supabase (pg_cron -> workflow_dispatch). Der GitHub-Zeitplan ist nur Reserve:
    # lief heute schon ein Dispatch, wird der geplante Lauf übersprungen (keine doppelten Videos).
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=0
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w "${{ github.workflow }}" --created ">=$(date -u +%F)" --json event -q '[.[]|select(.event=="workflow_dispatch")]|length')
            [ "${n:-0}" -gt 0 ] && skip=1
          fi
          # Kanal-Schalter im Agent-HQ (Seite „Kanäle & Projekte“): ruhen alle Kanäle dieses Workflows, nichts tun.
          K=sb_publishable_TvKHtP7D400zXCBFj4icPA_c7T6Hosp
          st=$(curl -s -m 15 -X POST https://kfiiaqjzzwwacthzrcut.supabase.co/rest/v1/rpc/project_status_all -H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{}' || true)
          on=$(echo "$st" | jq -r '[.["yt-waswaerewenn"]] | map(. // "aktiv") | any(. == "aktiv")' 2>/dev/null || echo true)
          echo "Kanal aktiv: $on"
          if [ "$on" = "false" ] && [ "${{ inputs.test }}" != "true" ]; then skip=1; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip"
  run:
    needs: guard
    if: needs.guard.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
      CI: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PFLEGE_UPLOAD_TOKEN: ${{ secrets.PFLEGE_UPLOAD_TOKEN }}
      FOLGE: ${{ inputs.folge }}
      PUBLISH: ${{ inputs.publish }}
      SHORTS_DAYS: ${{ inputs.shorts_days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg und Schriften
        run: |
          for i in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-liberation fonts-noto-color-emoji && break
            sleep 60
          done
      - name: Python-Pakete
        run: pip install -r requirements.txt
      - name: Tiefenmodell (Cache)
        uses: actions/cache@v4
        with:
          path: ~/.cache/waswaerewenn
          key: depth-anything-v2-small-onnx
      - name: YouTube-Zugang (Kanal Was waere wenn)
        env:
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_WWW }}
        run: |
          printf '%s' "$YT_CLIENT_SECRET" > client_secret.json
          printf '%s' "$YT_TOKEN" > token.json
      - name: Folge und Shorts erzeugen
        run: |
          DAY="${PUBLISH:-$(TZ=Europe/Berlin date -d tomorrow +%F)}"
          DOW=$(date -d "$DAY" +%u)
          # Mo->Mo+Di, Mi->Mi+Do, Fr->Fr+Sa, So->So  => jeden Tag 2 Shorts
          N="${SHORTS_DAYS:-$([ "$DOW" = "7" ] && echo 1 || echo 2)}"
          ARGS="--shorts-from $DAY --shorts-days $N"
          if [ "${{ inputs.test }}" != "true" ]; then ARGS="$ARGS --publish $DAY"; fi
          if [ -n "$FOLGE" ]; then python -m waswaerewenn.make "$FOLGE" $ARGS
          else python -m waswaerewenn.make --auto $ARGS; fi
      - name: Videos als Artefakt (3 Tage)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: waswaerewenn
          path: |
            output/waswaerewenn/**/video.mp4
            output/waswaerewenn/**/thumb.jpg
            output/waswaerewenn/**/shorts/*.mp4
          retention-days: 3
      - name: Stand sichern
        if: ${{ always() && inputs.test != true }}
        run: |
          git config user.name "waswaerewenn-bot"
          git config user.email "waswaerewenn-bot@users.noreply.github.com"
          git add waswaerewenn/state.json waswaerewenn/folgen/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Was waere wenn: neue Folge [skip ci]"
            git pull --rebase -q && git push -q
          fi
